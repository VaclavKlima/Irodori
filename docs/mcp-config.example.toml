# The camera table is already shared in the repository's .codex/config.toml.
# Trust the checkout and refresh Codex after completing docs/camera-control.md setup.
# Optional UI/editor tables below can be added to your local Codex configuration.
# Launch Codex inside the checkout; npm finds the package root from subdirectories.
[mcp_servers.irodori_ui]
command = "npm"
args = ["run", "--silent", "mcp:ui"]
cwd = "."
startup_timeout_sec = 30
tool_timeout_sec = 60

# Editing server for a normally running Irodori instance; CDP is not required.
[mcp_servers.irodori_editor]
command = "npm"
args = ["run", "--silent", "mcp:editor"]
cwd = "."
startup_timeout_sec = 30
tool_timeout_sec = 60
# For isolated-profile testing, uncomment and set the same profile as Electron:
# env = { IRODORI_PROFILE = "/absolute/test/profile" }

# Development USB camera server; independent of Electron and the photo library.
# On macOS first run npm run camera:setup:macos. Linux requires host gphoto2/USB access.
# Reference only: do not duplicate the camera table already present in the project.
[mcp_servers.irodori_camera]
command = "npm"
args = ["run", "--silent", "mcp:camera"]
cwd = "."
startup_timeout_sec = 30
tool_timeout_sec = 120
